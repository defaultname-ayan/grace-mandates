[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grace-mandates"
version = "0.1.0"
description = "Grace - the missing middle state for Indian auto-debit mandates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "jinja2>=3.1",
]

[project.optional-dependencies]
llm  = ["google-genai>=2.0"]                     # default provider (Gemini)
anthropic = ["anthropic>=1.0"]                   # optional alternate provider
live = ["razorpay>=1.4", "httpx>=0.27", "requests>=2.31"]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
dev  = ["pytest>=8.0"]
all  = ["google-genai>=2.0", "anthropic>=1.0", "razorpay>=1.4", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29", "pytest>=8.0"]

[project.scripts]
grace = "grace.cli:app"

[tool.setuptools.packages.find]
include = ["grace*"]

[tool.setuptools.package-data]
grace = ["templates/*.html", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:grace.*"]
